<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Corretor Automático Pro</title>
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; }
        h1 { margin-top: 50px; color: #3498db; }
        .subtitle { color: #bdc3c7; margin-bottom: 40px; }
        
        .btn-exam { display: inline-block; background-color: #3498db; color: white; border: none; padding: 20px 30px; margin: 15px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; width: 80%; max-width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; text-decoration: none; }
        .btn-exam:active { transform: scale(0.95); }
        
        #loading-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #result-screen { display: none; padding: 20px; }
        .score { font-size: 80px; font-weight: bold; color: #2ecc71; margin-top: 20px; }
        .debug-img { width: 100%; max-width: 500px; border-radius: 8px; margin-top: 20px; border: 2px solid #2ecc71; }
        .btn-back { background-color: #e74c3c; margin-top: 30px; }
    </style>
</head>
<body>

    <div id="home-screen">
        <h1>Corretor Pro</h1>
        <p class="subtitle">Visão Computacional na Nuvem</p>
        
        <!-- Input escondido para invocar a câmera nativa do celular -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
        
        <button class="btn-exam" onclick="startCapture('SIS 2')">Corrigir SIS 2</button>
        <button class="btn-exam" onclick="startCapture('SIS 3')">Corrigir SIS 3</button>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Analisando prova...</h2>
        <p>A inteligência artificial está lendo as respostas.</p>
    </div>

    <div id="result-screen">
        <h2>Nota do Aluno</h2>
        <div class="score" id="final-score">--</div>
        <p>de 60 questões</p>
        
        <h3>Raio-X da Correção:</h3>
        <img id="debug-image" class="debug-img" src="" alt="Raio-X">
        <br>
        <button class="btn-exam btn-back" onclick="resetApp()">Corrigir Outra</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
