<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leitor de Gabarito</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .header {
            width: 100%;
            padding: 15px 0;
            text-align: center;
            background-color: #2c3e50;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .camera-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* O canvas onde o OpenCV vai processar e desenhar o resultado */
        #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 5;
            display: none; 
        }

        .controls {
            width: 100%;
            padding: 20px;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
            z-index: 10;
            padding-bottom: 40px; /* Safe area for modern phones */
        }

        .exam-selector {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .exam-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #3498db;
            background-color: transparent;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .exam-btn.active {
            background-color: #3498db;
        }

        .capture-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #e74c3c;
            border: 4px solid #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .capture-btn:active {
            background-color: #c0392b;
            transform: scale(0.95);
        }

        #status-msg {
            font-size: 14px;
            color: #bdc3c7;
            text-align: center;
            margin-top: 5px;
        }

        /* Loading Spinner */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Scanner de Gabarito</h2>
    </div>

    <div class="camera-container">
        <!-- O vídeo direto da câmera -->
        <video id="video-feed" autoplay playsinline></video>
        <!-- O canvas onde mostraremos o resultado e o desenho do gabarito alinhado -->
        <canvas id="output-canvas"></canvas>
        
        <div id="loading">
            <p>Carregando Inteligência...</p>
        </div>
    </div>

    <div class="controls">
        <div id="status-msg">Aguardando câmera...</div>
        
        <div class="exam-selector">
            <button class="exam-btn active" id="btn-sis2">SIS 2</button>
            <button class="exam-btn" id="btn-sis3">SIS 3</button>
        </div>

        <div class="capture-btn" id="btn-capture"></div>
    </div>

    <!-- Importando o OpenCV.js (versão WebAssembly para rodar rápido) -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    
    <script src="app.js"></script>
</body>
</html>
